[tool.poetry]
name = "worktimepro-backend"
version = "0.1.0"
description = "Hr-Profi — multi-tenant HR/attendance API"
authors = ["Hr-Profi Team"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
gunicorn = "^23.0.0"
pydantic = "^2.9.0"
pydantic-settings = "^2.6.0"
sqlalchemy = { extras = ["asyncio"], version = "^2.0.36" }
asyncpg = "^0.30.0"
alembic = "^1.13.3"
greenlet = "^3.1.1"
redis = "^5.2.0"
celery = { extras = ["redis"], version = "^5.4.0" }
python-jose = { extras = ["cryptography"], version = "^3.3.0" }
passlib = { extras = ["bcrypt"], version = "^1.7.4" }
bcrypt = "4.0.1"
python-multipart = "^0.0.12"
email-validator = "^2.2.0"
minio = "^7.2.10"
httpx = "^0.27.2"
slowapi = "^0.1.9"
sentry-sdk = { extras = ["fastapi"], version = "^2.18.0" }
orjson = "^3.10.10"
tenacity = "^9.0.0"
python-json-logger = "^2.0.7"
pywebpush = "^2.0.0"
cryptography = "^43.0.0"
weasyprint = "^65.0"
openpyxl = "^3.1.5"
jinja2 = "^3.1.4"
# Face recognition stack — dlib (compiled in Docker) + ResNet weights
# bundled by face_recognition_models. ``numpy`` is already pulled in by
# face_recognition but pinning it makes the lockfile stable. Pillow is
# used to decode the kiosk's incoming JPEG before handing to dlib.
#
# ``setuptools`` is explicit because face_recognition_models still
# imports the legacy ``pkg_resources`` shim, which Python 3.12-slim no
# longer ships pre-installed. Without it the first /recognize call
# blows up with "No module named 'pkg_resources'" → 500.
# ArcFace embedding stack — pinned to the bare minimum so the image
# stays small on the 50 GB VPS. We talk to ONNX directly instead of
# pulling the full ``insightface`` package (which transitively drags
# in matplotlib, scikit-image, scikit-learn, albumentations — ~500 MB
# of weights and wheels we don't need for inference).
#
# Models (SCRFD detector + buffalo_s w600k_mbf recogniser) are
# downloaded by ``scripts/download_face_models.py`` during the
# Docker build and baked into the image. Image preprocessing
# (resize / RGB↔BGR / 5-point affine warp) is OpenCV.
onnxruntime = "^1.20.0"
opencv-python-headless = "^4.10.0.84"
numpy = "^1.26.4"
pillow = "^10.4.0"
setuptools = "^75.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
httpx = "^0.27.2"
ruff = "^0.7.0"
mypy = "^1.13.0"
testcontainers = { extras = ["postgres"], version = "^4.8.2" }
faker = "^30.8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "C4", "SIM", "RUF"]
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
ignore_missing_imports = true
