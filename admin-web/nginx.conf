server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any unknown path returns index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed assets.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Use Docker's embedded DNS (127.0.0.11) so a recreated `api` container
    # — which usually gets a new IP on the bridge network — is picked up
    # on the next request instead of returning 502 until nginx is itself
    # restarted. The variable in ``proxy_pass`` is what forces nginx to
    # re-resolve at request time; without it nginx caches the resolution
    # forever (the bug we hit twice in dev).
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Backend API proxy.
    location /api/ {
        set $api_upstream "http://api:8000";
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Don't fail-fast on a transient 502 from the upstream — give it
        # one re-resolve attempt so a freshly-recreated api isn't fatal.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_connect_timeout 5s;
    }

    location /ws/ {
        set $ws_upstream "http://api:8000";
        proxy_pass $ws_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # Don't expose nginx version.
    server_tokens off;
}
