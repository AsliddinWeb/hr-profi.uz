# Production overrides — kombinatsiya:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Pattern: HOST nginx 80/443 ni egallaydi (boshqa loyihalar bilan birga),
# bizning servislar `127.0.0.1:81xx` portlariga `bind` qilinadi va host
# nginx ularga `proxy_pass` qiladi. Traefik yo'q — minimal RAM uchun.
#
# RAM siqilgan rejim (~600 MB total):
#   - api:   gunicorn 1 worker
#   - celery_worker: --concurrency=1
#   - postgres: shared_buffers 64MB
#   - resource limits har bir konteynerda
services:
  postgres:
    # Faqat docker network'da. Tashqaridan o'qilmaydi.
    ports: !reset []
    command:
      - "postgres"
      - "-c"
      - "timezone=Asia/Tashkent"
      - "-c"
      - "shared_buffers=64MB"
      - "-c"
      - "effective_cache_size=192MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "max_connections=40"
    deploy:
      resources:
        limits:
          memory: 256M

  redis:
    ports: !reset []
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    deploy:
      resources:
        limits:
          memory: 96M

  minio:
    # files.hr-profi.uz uchun host nginx 127.0.0.1:9100 ga proxy qiladi.
    # !override muhim — dev fayldagi 9000:9000 / 9001:9001 (0.0.0.0)
    # binding'lar bilan birlashib qolmasligi uchun.
    ports:
      - "127.0.0.1:9100:9000"
      - "127.0.0.1:9101:9001"
    deploy:
      resources:
        limits:
          memory: 192M

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: "false"
    # Dev volume mount'ni o'chiramiz — image ichidagi build ishlasin.
    volumes: !override
      - media:/app/media
    # Exec-form (JSON array) — YAML folding xatolarisiz, gunicorn flag'lari
    # to'g'ridan-to'g'ri o'tadi. ``exec`` qoldirib kelmasdan, sh PID 1 da
    # qolib qolmasligi uchun ishlatamiz (signal/Ctrl+C to'g'ri o'tadi).
    command:
      - sh
      - -c
      - "alembic upgrade head && exec gunicorn app.main:app -k uvicorn.workers.UvicornWorker -w 1 -b 0.0.0.0:8000 --access-logfile - --error-logfile -"
    ports:
      - "127.0.0.1:8100:8000"
    # Phase 4 face matching loads dlib (~150 MB resident) when the kiosk
    # ``/recognize`` endpoint first fires. The bump from 512 → 768 MB
    # gives a ~100 MB cushion above peak observed on a 100-employee
    # branch; tune downwards if you don't run the kiosk path.
    deploy:
      resources:
        limits:
          memory: 768M

  celery_worker:
    volumes: !override
      - media:/app/media
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=info", "--concurrency=1", "--max-tasks-per-child=100"]
    # Worker also runs the face.compute_employee_embedding task which
    # imports dlib + face_recognition_models. 256 → 512 MB gives the
    # same headroom as api when an enrol burst hits.
    deploy:
      resources:
        limits:
          memory: 512M

  celery_beat:
    volumes: !override
      - media:/app/media
    deploy:
      resources:
        limits:
          memory: 96M

  admin_web:
    profiles: ["web", ""]   # `web` profile shartini olib tashlaymiz
    build:
      context: ./admin-web
      dockerfile: Dockerfile
      args:
        # Admin-web ichidagi nginx /api/v1 ni proxy qiladi (same-origin, CORSsiz).
        VITE_API_URL: /api/v1
        VITE_WS_URL: /ws
    ports:
      - "127.0.0.1:8101:80"
    deploy:
      resources:
        limits:
          memory: 64M

  client_web:
    profiles: ["web", ""]
    build:
      context: ./client-web
      dockerfile: Dockerfile
      args:
        API_PROXY_TARGET: http://api:8000
    ports:
      - "127.0.0.1:8102:5174"
    deploy:
      resources:
        limits:
          memory: 192M

  # kiosk.hr-profi.uz — tablet PWA. Host nginx proxies 127.0.0.1:8104.
  kiosk_web:
    profiles: ["web", ""]
    build:
      context: ./kiosk-web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
    ports:
      - "127.0.0.1:8104:80"
    deploy:
      resources:
        limits:
          memory: 64M

  landing:
    build:
      context: ./infra/landing
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8103:80"
    deploy:
      resources:
        limits:
          memory: 32M
