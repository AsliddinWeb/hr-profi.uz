# Backend API (FastAPI/Gunicorn)
# Mobile va tashqi integratsiyalar uchun.
server {
    listen 80;
    listen [::]:80;
    server_name api.hr-profi.uz;

    client_max_body_size 30M;

    # Hikvision face terminals (DS-K1T343 firmware V3.3.4) HTTP Listening
    # ne podderzhivaet TLS — only plain HTTP. Bu maxsus yo'lakni HTTPS'ga
    # redirect qilmaymiz, qolgan hammasi default 301'ga ketadi.
    # Auth'i ?key=<api_key> orqali query-string'da.
    location /api/v1/devices/webhook/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
}
