# Tablet kiosk PWA (kiosk-web). Serves the same /api/* routes via the
# in-container nginx so the tablet hits ``kiosk.hr-profi.uz/api/...``
# directly with no CORS preflight.
server {
    listen 80;
    listen [::]:80;
    server_name kiosk.hr-profi.uz;

    client_max_body_size 30M;

    location / {
        proxy_pass http://127.0.0.1:8104;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
